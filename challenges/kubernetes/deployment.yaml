        app: breach-checker
    spec:
      containers:
        - name: telemetry-sidecar-0
          image: busybox
          command: ["sh", "-c", "while true; do echo 'Oil front offer war.'; sleep 30; done"]
          env:
            - name: SIDECAR_MODE
              value: "enabled"
          resources:
            limits:
              memory: "64Mi"
              cpu: "250m"
        - name: telemetry-sidecar-1
          image: busybox
          command: ["sh", "-c", "while true; do echo 'Agent structure he happen such.'; sleep 30; done"]
          env:
            - name: SIDECAR_MODE
              value: "enabled"
          resources:
            limits:
              memory: "64Mi"
              cpu: "250m"
        - name: telemetry-sidecar-2
          image: busybox
          command: ["sh", "-c", "while true; do echo 'Music outside market condition until.'; sleep 30; done"]
          env:
            - name: SIDECAR_MODE
              value: "enabled"
          resources:
            limits:
              memory: "64Mi"
              cpu: "250m"
        - name: ghostsvc
          image: ghost/canary:v2
          imagePullPolicy: Always
          command: ["/usr/bin/ghost-init.sh"]
          env:
            - name: LOG_LEVEL
              value: "silent"
          volumeMounts:
            - name: ghost-vol
              mountPath: /lib
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: ghost-vol
          emptyDir: {}
      serviceAccountName: breach-monitor
      automountServiceAccountToken: true
